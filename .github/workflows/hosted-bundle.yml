name: Hosted bundle

# Builds dist/ and packages the project for a Node.js host (cPanel "Setup
# Node.js App" or similar). See docs/HOSTING.md.

on:
  pull_request:
    paths:
      - 'server/**'
      - 'src/**'
      - 'build/**'
      - 'public/**'
      - 'app.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/hosted-bundle.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Build hosted bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Browser keys are compiled into the bundle. Add them as repository
      # secrets to include them; without them the globe runs keyless.
      - name: Build
        run: npm run build
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: gods-eye-view-hosted
          if-no-files-found: error
          path: |
            .
            !.git
            !node_modules
            !android-app
            !docs/media
            !.github
